name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Q1 Test 1
      id: q1-test-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q1 Test 1
        setup-command: javac Q1/UpperLowerCases.java
        command: java -cp Q1 UpperLowerCases
        input: smile
        expected-output: |-
          The word in uppercase letters is SMILE
          The word in lowercase letters is smile
          The original word is smile
        comparison-method: contains
        timeout: 10
        max-score: 2
    - name: Q1 Test 2
      id: q1-test-2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q1 Test 2
        setup-command: javac Q1/UpperLowerCases.java
        command: java -cp Q1 UpperLowerCases
        input: SHOUT
        expected-output: |-
          The word in uppercase letters is SHOUT
          The word in lowercase letters is shout
          The original word is SHOUT
        comparison-method: contains
        timeout: 10
        max-score: 2
    - name: Q1 Test 3
      id: q1-test-3
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q1 Test 3
        setup-command: javac Q1/UpperLowerCases.java
        command: java -cp Q1 UpperLowerCases
        input: WoBbLe
        expected-output: |-
          The word in uppercase letters is WOBBLE
          The word in lowercase letters is wobble
          The original word is WoBbLe
        comparison-method: contains
        timeout: 10
        max-score: 2
    - name: Q1 Test 4
      id: q1-test-4
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q1 Test 4
        setup-command: javac Q1/UpperLowerCases.java
        command: java -cp Q1 UpperLowerCases
        input: SO many WoRdS!
        expected-output: |-
          The word in uppercase letters is SO
          The word in lowercase letters is so
          The original word is SO
        comparison-method: contains
        timeout: 10
        max-score: 2
    - name: Q1 Test 5
      id: q1-test-5
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q1 Test 5
        setup-command: javac Q1/UpperLowerCases.java
        command: java -cp Q1 UpperLowerCases
        input: 256 is a number that should not crash my program
        expected-output: |-
          The word in uppercase letters is 256
          The word in lowercase letters is 256
          The original word is 256
        comparison-method: contains
        timeout: 10
        max-score: 2
    - name: Q2 Test 1
      id: q2-test-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q2 Test 1
        setup-command: javac Q2/EmailVerifier.java
        command: java -cp Q2 EmailVerifier
        input: bob
        expected-output: This is not an email address
        comparison-method: contains
        timeout: 10
        max-score: 2
    - name: Q2 Test 2
      id: q2-test-2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q2 Test 2
        setup-command: javac Q2/EmailVerifier.java
        command: java -cp Q2 EmailVerifier
        input: bob@smiledotcom
        expected-output: This is not an email address
        comparison-method: contains
        timeout: 10
        max-score: 2
    - name: Q2 Test 3
      id: q2-test-3
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q2 Test 3
        setup-command: javac Q2/EmailVerifier.java
        command: java -cp Q2 EmailVerifier
        input: botatsmile.com
        expected-output: This is not an email address
        comparison-method: contains
        timeout: 10
        max-score: 2
    - name: Q2 Test 4
      id: q2-test-4
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q2 Test 4
        setup-command: javac Q2/EmailVerifier.java
        command: java -cp Q2 EmailVerifier
        input: bob@smile.com
        expected-output: This is an email address
        comparison-method: contains
        timeout: 10
        max-score: 2
    - name: Q2 Test 5
      id: q2-test-5
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q2 Test 5
        setup-command: javac Q2/EmailVerifier.java
        command: java -cp Q2 EmailVerifier
        input: com.smile@bob
        expected-output: This is not an email address
        comparison-method: contains
        timeout: 10
        max-score: 2
    - name: Q3 Test 1
      id: q3-test-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q3 Test 1
        setup-command: javac Q3/MinimumOfNums.java
        command: java -cp Q3 MinimumOfNums
        input: |-
          1
          5
        expected-output: The minimum is 5
        comparison-method: contains
        timeout: 10
        max-score: 2
    - name: Q3 Test 2
      id: q3-test-2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q3 Test 2
        setup-command: javac Q3/MinimumOfNums.java
        command: java -cp Q3 MinimumOfNums
        input: |-
          5
          5
          4
          3
          2
          1
        expected-output: The minimum is 1
        comparison-method: contains
        timeout: 10
        max-score: 2
    - name: Q3 Test 3
      id: q3-test-3
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q3 Test 3
        setup-command: javac Q3/MinimumOfNums.java
        command: java -cp Q3 MinimumOfNums
        input: |-
          3
          -5
          12
          5
        expected-output: The minimum is -5
        comparison-method: contains
        timeout: 10
        max-score: 2
    - name: Q3 Test 4
      id: q3-test-4
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q3 Test 4
        setup-command: javac Q3/MinimumOfNums.java
        command: java -cp Q3 MinimumOfNums
        input: |-
          0
          0
          0
          5
          0
          -1
          -5
          -3
          -2
        expected-output: The minimum is -5
        comparison-method: contains
        timeout: 10
        max-score: 2
    - name: Q3 Test 5
      id: q3-test-5
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q3 Test 5
        setup-command: javac Q3/MinimumOfNums.java
        command: java -cp Q3 MinimumOfNums
        input: |-
          -999
          2
          7
          5
        expected-output: The minimum is 5
        comparison-method: contains
        timeout: 10
        max-score: 2
    - name: Q4 Test 1
      id: q4-test-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q4 Test 1
        setup-command: javac Q4/SumOfIntegers.java
        command: java -cp Q4 SumOfIntegers
        input: |-
          1
          10
        expected-output: The sum of integers from 1 to 10 is 55
        comparison-method: contains
        timeout: 10
        max-score: 2
    - name: Q4 Test 2
      id: q4-test-2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q4 Test 2
        setup-command: javac Q4/SumOfIntegers
        command: java -cp Q4 SumOfIntegers
        input: |-
          -10
          -5
        expected-output: The sum of the integers from -10 to -5 is -45
        comparison-method: contains
        timeout: 10
        max-score: 2
    - name: Q4 Test 3
      id: q4-test-3
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q4 Test 3
        setup-command: javac Q4/SumOfIntegers.java
        command: java -cp Q4 SumOfIntegers
        input: |-
          0
          100
        expected-output: The sum of the integers from 0 to 100 is 5050
        comparison-method: contains
        timeout: 10
        max-score: 2
    - name: Q4 Test 4
      id: q4-test-4
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q4 Test 4
        setup-command: javac Q4/SumOfIntegers.java
        command: java -cp Q4 SumOfIntegers
        input: |-
          100
          0
        expected-output: The sum of the integers from 0 to 100 is 5050
        comparison-method: contains
        timeout: 10
        max-score: 2
    - name: Q4 Test 5
      id: q4-test-5
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q4 Test 5
        setup-command: javac Q4/SumOfIntegers.java
        command: java -cp Q4 SumOfIntegers
        input: |-
          -200
          200
        expected-output: The sum of the integers from -200 to 200 is 0
        comparison-method: contains
        timeout: 10
        max-score: 2
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        Q1-TEST-1_RESULTS: "${{steps.q1-test-1.outputs.result}}"
        Q1-TEST-2_RESULTS: "${{steps.q1-test-2.outputs.result}}"
        Q1-TEST-3_RESULTS: "${{steps.q1-test-3.outputs.result}}"
        Q1-TEST-4_RESULTS: "${{steps.q1-test-4.outputs.result}}"
        Q1-TEST-5_RESULTS: "${{steps.q1-test-5.outputs.result}}"
        Q2-TEST-1_RESULTS: "${{steps.q2-test-1.outputs.result}}"
        Q2-TEST-2_RESULTS: "${{steps.q2-test-2.outputs.result}}"
        Q2-TEST-3_RESULTS: "${{steps.q2-test-3.outputs.result}}"
        Q2-TEST-4_RESULTS: "${{steps.q2-test-4.outputs.result}}"
        Q2-TEST-5_RESULTS: "${{steps.q2-test-5.outputs.result}}"
        Q3-TEST-1_RESULTS: "${{steps.q3-test-1.outputs.result}}"
        Q3-TEST-2_RESULTS: "${{steps.q3-test-2.outputs.result}}"
        Q3-TEST-3_RESULTS: "${{steps.q3-test-3.outputs.result}}"
        Q3-TEST-4_RESULTS: "${{steps.q3-test-4.outputs.result}}"
        Q3-TEST-5_RESULTS: "${{steps.q3-test-5.outputs.result}}"
        Q4-TEST-1_RESULTS: "${{steps.q4-test-1.outputs.result}}"
        Q4-TEST-2_RESULTS: "${{steps.q4-test-2.outputs.result}}"
        Q4-TEST-3_RESULTS: "${{steps.q4-test-3.outputs.result}}"
        Q4-TEST-4_RESULTS: "${{steps.q4-test-4.outputs.result}}"
        Q4-TEST-5_RESULTS: "${{steps.q4-test-5.outputs.result}}"
      with:
        runners: q1-test-1,q1-test-2,q1-test-3,q1-test-4,q1-test-5,q2-test-1,q2-test-2,q2-test-3,q2-test-4,q2-test-5,q3-test-1,q3-test-2,q3-test-3,q3-test-4,q3-test-5,q4-test-1,q4-test-2,q4-test-3,q4-test-4,q4-test-5
